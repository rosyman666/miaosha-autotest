name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码语法检查
        run: python -m compileall -q common testcases conftest.py

      - name: 用例可收集性检查
        run: python -m pytest --collect-only -q -m "not miaosha_write"

# 说明：被测的秒杀系统是本地部署的（MySQL + Redis + RabbitMQ + 应用 8003），
# 托管 CI 环境里没有这套服务，因此这里只做「语法检查 + 用例收集」，
# 保证工程本身可安装、可导入、用例可被发现。
# 完整回归请在本地服务起来后执行：python -m pytest
